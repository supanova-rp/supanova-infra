services:
  supanova-server:
  # TODO: revert this to latest
    image: jdgarner/supanova-server:metrics
    container_name: supanova-server
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
      - "${METRICS_PORT}:${METRICS_PORT}"
    env_file: .env.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${SERVER_PORT}/v2/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "{{.Name}}"
        fluentd-async: "true"
        fluentd-max-retries: "5"

  supanova-maintenance:
    image: jdgarner/supanova-maintenance:latest
    container_name: supanova-maintenance
    env_file: .env.maintenance
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "{{.Name}}"
        fluentd-async: "true"
        fluentd-max-retries: "5"

  postgres:
    image: postgres:18-alpine
    container_name: supanova-server-postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432" # Once node app is removed, we no longer need to expose a port here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: supanova-server-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
  
  grafana:
    image: grafana/grafana:latest
    container_name: supanova-server-grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus

  fluent-bit:
    image: fluent/fluent-bit:4.2.0
    container_name: fluent-bit
    network_mode: host
    restart: unless-stopped
    env_file: .env.fluent-bit
    volumes:
      - ${HOME}/apps/supanova-infra/docker/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ${HOME}/apps/supanova-infra/docker/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro

volumes:
  postgres_data:
  prometheus_data:
